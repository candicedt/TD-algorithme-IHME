
services:
  db:
    image: postgres:17-alpine
    container_name: laboratoire-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: lab_reservations
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_app -d lab_reservations"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
